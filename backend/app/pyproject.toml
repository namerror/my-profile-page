[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-page-backend"
version = "0.1.0"
description = "FastAPI backend for personal profile page"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "SQLAlchemy==2.0.44",
    "pydantic==2.12.4",
    "python-dotenv==1.2.1",
    "python-jose[cryptography]==3.5.0",
    "alembic==1.17.2",
    "uvloop==0.22.1",
    "watchfiles==1.1.1",
]
